{% if posts %}
    <header>
        <h1>Blog Posts</h1>
        <a href="/blog/create/">Create New Post</a>
    </header>
    <ul>
    {% for post in posts %}
        <li><a href="/blog/{{ post.id }}/">{{ post.title }} {{post.created_at}}</a></li>
    {% endfor %}
    </ul>
{% else %}
    <p>No blog posts are available.</p>
{% endif %}
