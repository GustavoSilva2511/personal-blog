<!-- templates/base.html -->
{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Um blog pessoal sobre tecnologia, ideias e aprendizado.">
    <title>{% block title %}Blog Pessoal{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    {% tailwind_css %}
</head>
<body class="min-h-screen flex flex-col font-sans">

    <!-- Shared Navigation Bar -->
    <header class="sticky top-0 z-40 border-b border-slate-200/80 bg-slate-50/80 backdrop-blur-md">
        <nav class="mx-auto flex h-16 w-full max-w-5xl items-center justify-between px-6">
            <a href="{% url 'home' %}" class="font-serif text-xl font-semibold tracking-tight text-slate-900 transition-colors hover:text-indigo-600">
                Blog Pessoal
            </a>
            <div class="flex items-center gap-6 text-sm font-medium">
                <a href="{% url 'home' %}" class="text-slate-600 transition-colors hover:text-indigo-600">Artigos</a>
            </div>
        </nav>
    </header>

    <!-- Main Dynamic Content Block -->
    <main class="mx-auto w-full max-w-5xl flex-1 px-6 py-12 md:py-16">
        {% block content %}
        <!-- Child templates will inject their content here -->
        {% endblock %}
    </main>

    <!-- Shared Footer -->
    <footer class="border-t border-slate-200/80">
        <div class="mx-auto flex w-full max-w-5xl flex-col items-center justify-between gap-2 px-6 py-8 text-sm text-slate-500 sm:flex-row">
            <p>Gustavo Silva &copy; {% now "Y" %} Blog Pessoal. Todos os direitos reservados.</p>
            <p class="text-slate-400">Feito com Django &amp; Tailwind CSS</p>
        </div>
    </footer>

</body>
</html>
